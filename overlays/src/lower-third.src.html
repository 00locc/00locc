<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lower Third Maker</title>
<style>
/*__FONTS__*/
:root {
  --ink: #16202e;
  --muted: #5b6676;
  --line: #d9dee6;
  --panel: #ffffff;
  --page: #f3f5f8;
  --brand: #1d4ed8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3442; --panel: #171c25; --page: #0f131a; --brand: #6c9bff;
  }
}
:root[data-theme="dark"] {
  --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3442; --panel: #171c25; --page: #0f131a; --brand: #6c9bff;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Montserrat", system-ui, sans-serif; background: var(--page); color: var(--ink); }

/* ---------- Overlay (what Wirecast shows) ---------- */
body.overlay-mode { background: transparent; overflow: hidden; }
.viewport { position: fixed; inset: 0; overflow: hidden; }
.stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  font-family: "Montserrat", sans-serif;
  --accent: #d4a63a;
  --plate: rgba(12, 22, 46, 0.93);
  --name: #ffffff;
  --role: var(--accent);
  --pill-bg: var(--accent);
  --pill-ink: #111827;
}
.lt {
  position: absolute; left: 130px; bottom: 105px;
  display: flex; flex-direction: column; align-items: flex-start;
  max-width: 1500px;
}
.pill {
  font-weight: 700; font-size: 21px; letter-spacing: .14em; text-transform: uppercase;
  background: var(--pill-bg); color: var(--pill-ink);
  padding: 7px 18px 6px; border-radius: 6px 6px 0 0; margin-left: 12px;
}
.pill:empty { display: none; }
.row { display: flex; align-items: stretch; }
.bar { width: 12px; background: var(--accent); border-radius: 4px 0 0 4px; }
.plate {
  display: flex; align-items: center; gap: 26px;
  background: var(--plate);
  padding: 22px 46px 24px 30px;
  border-radius: 0 10px 10px 0;
  box-shadow: 0 10px 30px rgba(0,0,0,.28);
}
.logo { width: 92px; height: 92px; border-radius: 50%; background: #fff center / 80% no-repeat; flex: none; display: none; }
.logo.on { display: block; }
.text { display: flex; flex-direction: column; min-width: 0; }
.name { font-weight: 700; font-size: 62px; line-height: 1.08; color: var(--name); white-space: nowrap; }
.role { font-weight: 600; font-size: 27px; letter-spacing: .13em; text-transform: uppercase; color: var(--role); margin-top: 6px; white-space: nowrap; }
.role:empty { display: none; }

/* Light theme */
.stage.t-light { --plate: rgba(255,255,255,0.96); --name: #0f1b33; --role: #8a6510; }
/* Minimal theme: no box, soft shadow along the bottom of the frame */
.stage.t-minimal .shade { position: absolute; inset: auto 0 0 0; height: 430px; background: linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,0)); }
.stage.t-minimal .plate { background: transparent; box-shadow: none; padding: 4px 0 4px 26px; }
.stage.t-minimal .bar { width: 6px; border-radius: 3px; }
.stage.t-minimal .pill { background: transparent; color: var(--accent); padding: 0 0 8px 0; margin-left: 32px; }
.stage.t-minimal .name { text-shadow: 0 2px 12px rgba(0,0,0,.45); }
.stage.t-minimal .role { color: #f1f1f1; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.shade { display: none; }
.stage.t-minimal .shade { display: block; }

/* Entrance animation */
.stage.animate .bar   { animation: barIn .35s cubic-bezier(.2,.8,.2,1) both; }
.stage.animate .plate { animation: wipe .55s .15s cubic-bezier(.2,.8,.2,1) both; }
.stage.animate .text, .stage.animate .logo { animation: rise .45s .45s ease-out both; }
.stage.animate .pill  { animation: fade .4s .6s ease-out both; }
.stage.animate .shade { animation: fade .6s ease-out both; }
@keyframes barIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes wipe  { from { clip-path: inset(-60px 100% -60px -60px); } to { clip-path: inset(-60px -90px -90px -60px); } }
@keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade  { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Maker (setup page) ---------- */
.maker { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.maker h1 { font-size: 22px; margin: 4px 0 2px; }
.maker .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
.grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card h2 { font-size: 15px; margin: 0 0 12px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .06em; }
input[type=text], select, textarea {
  width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--page);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
}
textarea { min-height: 170px; font-size: 13px; line-height: 1.5; resize: vertical; }
.inline { display: flex; gap: 10px; align-items: center; }
input[type=color] { width: 44px; height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--page); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--panel); outline: 1px solid var(--line); cursor: pointer; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn { font: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.sm { font-size: 12px; padding: 6px 10px; }
.preview { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(255,240,220,.55), transparent 60%),
    linear-gradient(180deg, #d9d2c6 0%, #b9ad9c 62%, #6d5e4c 63%, #4a3e31 100%); }
.preview .stage { position: absolute; }
.hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.item .meta { min-width: 0; font-size: 13px; }
.item .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta span { color: var(--muted); font-size: 12px; }
.item .acts { display: flex; gap: 6px; flex: none; }
#exportHost { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform: translateX(-200vw); pointer-events: none; }
</style>
</head>
<body>

<!-- The overlay graphic. In Wirecast (?name=...) only this is shown. -->
<template id="stageTpl">
  <div class="stage">
    <div class="shade"></div>
    <div class="lt">
      <div class="pill"></div>
      <div class="row">
        <div class="bar"></div>
        <div class="plate">
          <div class="logo"></div>
          <div class="text">
            <div class="name"></div>
            <div class="role"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<div id="app"></div>
<div id="exportHost" aria-hidden="true"></div>
<div class="toast" id="toast"></div>

<script>/*__LIBS__*/</script>
<script>
(function () {
  "use strict";

  var THEMES = { royal: "Royal (dark plate)", light: "Light (white plate)", minimal: "Minimal (no box)" };
  var ACCENTS = ["#d4a63a", "#2bb3a3", "#3b82f6", "#c0392b", "#8e5bd8", "#e67e22"];
  var DEFAULTS = { section: "Sabbath School", role: "Opening Prayer", name: "Jane Mensah", theme: "royal", accent: "#d4a63a", logo: false };
  var SAMPLE_PROGRAM = [
    "Sabbath School | Superintendent | Name Here",
    "Sabbath School | Facilitator | Name Here",
    "Sabbath School | Opening Prayer | Name Here",
    "Sabbath School | Closing Prayer | Name Here",
    "Divine Service | Scripture Reading | Name Here",
    "Divine Service | Special Song | Name Here",
    "Divine Service | Sermon | Name Here"
  ].join("\n");

  // ---------- Shared: build and fill one overlay ----------
  function makeStage() {
    return document.getElementById("stageTpl").content.firstElementChild.cloneNode(true);
  }

  function fillStage(stage, o) {
    stage.className = "stage t-" + (THEMES[o.theme] ? o.theme : "royal");
    stage.style.setProperty("--accent", o.accent || DEFAULTS.accent);
    stage.querySelector(".pill").textContent = o.section || "";
    stage.querySelector(".name").textContent = o.name || "";
    stage.querySelector(".role").textContent = o.role || "";
    var logo = stage.querySelector(".logo");
    logo.classList.toggle("on", !!o.logoSrc);
    logo.style.backgroundImage = o.logoSrc ? 'url("' + o.logoSrc + '")' : "";
    fitText(stage);
  }

  // Shrink long names so the plate never runs off screen.
  function fitText(stage) {
    var name = stage.querySelector(".name"), role = stage.querySelector(".role");
    var max = 1380;
    [[name, 62, 38], [role, 27, 18]].forEach(function (t) {
      var el = t[0], size = t[1];
      el.style.fontSize = size + "px";
      while (el.scrollWidth > max && size > t[2]) { size -= 2; el.style.fontSize = size + "px"; }
    });
  }

  function scaleTo(stage, box) {
    var s = Math.min(box.clientWidth / 1920, box.clientHeight / 1080);
    stage.style.transform = "scale(" + s + ")";
  }

  function replay(stage) {
    stage.classList.remove("animate");
    void stage.offsetWidth;
    stage.classList.add("animate");
  }

  function waitForFonts() {
    return (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  }

  var params = new URLSearchParams(location.search);

  // ---------- Overlay mode: Wirecast Web Page shot ----------
  if (params.has("name") || params.has("role")) {
    document.body.classList.add("overlay-mode");
    var vp = document.createElement("div");
    vp.className = "viewport";
    var stage = makeStage();
    vp.appendChild(stage);
    document.getElementById("app").appendChild(vp);
    var logoParam = params.get("logo");
    fillStage(stage, {
      section: params.get("section") || "",
      role: params.get("role") || "",
      name: params.get("name") || "",
      theme: params.get("theme") || "royal",
      accent: params.get("accent") ? "#" + params.get("accent").replace(/^#/, "") : DEFAULTS.accent,
      logoSrc: logoParam ? (logoParam === "1" ? "logo.png" : logoParam) : ""
    });
    var fit = function () { scaleTo(stage, vp); };
    fit();
    window.addEventListener("resize", fit);
    waitForFonts().then(function () {
      fitText(stage);
      if (params.get("anim") !== "0") replay(stage);
    });
    return;
  }

  // ---------- Maker mode ----------
  var state = load();
  var logoData = "";

  var app = document.getElementById("app");
  app.innerHTML =
    '<div class="maker">' +
      '<h1>Lower Third Maker</h1>' +
      '<p class="sub">Type a name and role, pick a look, then <b>Copy Wirecast link</b> (for an animated Web Page shot) or <b>Download PNG</b> (a still image you can drag into Wirecast).</p>' +
      '<div class="grid">' +
        '<div class="card">' +
          '<h2>Details</h2>' +
          '<label for="f-section">Section tag</label><input type="text" id="f-section" placeholder="e.g. Divine Service">' +
          '<label for="f-role">Role</label><input type="text" id="f-role" placeholder="e.g. Scripture Reading">' +
          '<label for="f-name">Name</label><input type="text" id="f-name" placeholder="e.g. Elder Kwame Asante">' +
          '<label for="f-theme">Look</label><select id="f-theme"></select>' +
          '<label>Accent colour</label>' +
          '<div class="inline"><input type="color" id="f-accent"><div class="swatches" id="swatches"></div></div>' +
          '<label for="f-logo">Logo (optional, PNG)</label>' +
          '<input type="file" id="f-logo" accept="image/png,image/jpeg,image/svg+xml">' +
          '<div class="hint">For the Wirecast link, save your logo as <b>logo.png</b> in the same folder as this file.</div>' +
          '<div class="btns">' +
            '<button class="btn primary" id="b-copy">Copy Wirecast link</button>' +
            '<button class="btn" id="b-png">Download PNG</button>' +
            '<button class="btn" id="b-play">Replay animation</button>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="card"><h2>Preview</h2><div class="preview" id="preview"></div>' +
            '<div class="hint">Preview of a 1920×1080 frame. The background here is a stand-in; in Wirecast the overlay sits on your camera.</div></div>' +
          '<div class="card" style="margin-top:18px">' +
            '<h2>Whole service at once</h2>' +
            '<div class="hint" style="margin:0 0 8px">One per line: <b>Section | Role | Name</b>. Uses the look and colour chosen above.</div>' +
            '<textarea id="f-program" spellcheck="false"></textarea>' +
            '<div class="btns"><button class="btn primary" id="b-zip">Download all PNGs (ZIP)</button></div>' +
            '<div class="list" id="list"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  var $ = function (id) { return document.getElementById(id); };
  var themeSel = $("f-theme");
  Object.keys(THEMES).forEach(function (k) {
    var o = document.createElement("option"); o.value = k; o.textContent = THEMES[k]; themeSel.appendChild(o);
  });
  ACCENTS.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button"; b.style.background = c; b.title = c; b.setAttribute("aria-label", "Accent " + c);
    b.onclick = function () { $("f-accent").value = c; update(); };
    $("swatches").appendChild(b);
  });

  $("f-section").value = state.section; $("f-role").value = state.role; $("f-name").value = state.name;
  themeSel.value = state.theme; $("f-accent").value = state.accent; $("f-program").value = state.program || SAMPLE_PROGRAM;

  var preview = $("preview");
  var pStage = makeStage();
  preview.appendChild(pStage);

  function current() {
    return {
      section: $("f-section").value.trim(), role: $("f-role").value.trim(), name: $("f-name").value.trim(),
      theme: themeSel.value, accent: $("f-accent").value, logoSrc: logoData
    };
  }

  function update(animate) {
    var o = current();
    fillStage(pStage, o);
    scaleTo(pStage, preview);
    if (animate) replay(pStage);
    state = { section: o.section, role: o.role, name: o.name, theme: o.theme, accent: o.accent, program: $("f-program").value };
    save(state);
    renderList();
  }

  ["f-section", "f-role", "f-name", "f-accent"].forEach(function (id) { $(id).addEventListener("input", function () { update(false); }); });
  themeSel.addEventListener("change", function () { update(true); });
  $("f-program").addEventListener("input", function () { update(false); });
  $("f-logo").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) { logoData = ""; update(false); return; }
    var r = new FileReader();
    r.onload = function () { logoData = r.result; update(true); };
    r.readAsDataURL(f);
  });
  window.addEventListener("resize", function () { scaleTo(pStage, preview); });

  // ---------- Links for Wirecast ----------
  function linkFor(o) {
    var base = location.href.split(/[?#]/)[0];
    var q = new URLSearchParams();
    if (o.section) q.set("section", o.section);
    if (o.role) q.set("role", o.role);
    q.set("name", o.name || "");
    q.set("theme", o.theme);
    q.set("accent", o.accent.replace("#", ""));
    if (o.logoSrc) q.set("logo", "1");
    return base + "?" + q.toString();
  }

  function copy(text, okMsg) {
    var done = function () { toast(okMsg); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) {
    var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (e) {}
    t.remove();
  }

  $("b-copy").onclick = function () { copy(linkFor(current()), "Link copied. In Wirecast: + → Web Page → paste."); };
  $("b-play").onclick = function () { replay(pStage); };

  // ---------- PNG export (transparent background) ----------
  var exportHost = $("exportHost");
  function renderPng(o) {
    exportHost.innerHTML = "";
    var st = makeStage();
    exportHost.appendChild(st);
    fillStage(st, o);
    return waitForFonts().then(function () {
      fitText(st);
      return htmlToImage.toBlob(st, { width: 1920, height: 1080, pixelRatio: 1, style: { transform: "none" } });
    });
  }

  function fileName(o) {
    var s = [o.section, o.role, o.name].filter(Boolean).join(" - ") || "lower-third";
    return s.replace(/[\\/:*?"<>|]+/g, "").slice(0, 120) + ".png";
  }

  function download(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  function exportOne(o) {
    toast("Making PNG…");
    renderPng(o).then(function (blob) { download(blob, fileName(o)); toast("PNG saved: " + fileName(o)); })
      .catch(function () { toast("Couldn't make the PNG here. Open this file on the Mac in Chrome or Safari."); });
  }
  $("b-png").onclick = function () { exportOne(current()); };

  // ---------- Program list ----------
  function programItems() {
    var base = current();
    return $("f-program").value.split("\n").map(function (line) {
      var p = line.split("|").map(function (s) { return s.trim(); });
      if (!line.trim()) return null;
      if (p.length === 1) return { section: "", role: "", name: p[0] };
      if (p.length === 2) return { section: "", role: p[0], name: p[1] };
      return { section: p[0], role: p[1], name: p.slice(2).join(" | ") };
    }).filter(Boolean).map(function (it) {
      it.theme = base.theme; it.accent = base.accent; it.logoSrc = base.logoSrc; return it;
    });
  }

  function renderList() {
    var list = $("list");
    list.innerHTML = "";
    programItems().forEach(function (it) {
      var row = document.createElement("div"); row.className = "item";
      var meta = document.createElement("div"); meta.className = "meta";
      var b = document.createElement("b"); b.textContent = it.name || "(no name)";
      var s = document.createElement("span"); s.textContent = [it.section, it.role].filter(Boolean).join(" · ");
      meta.appendChild(b); meta.appendChild(s);
      var acts = document.createElement("div"); acts.className = "acts";
      var bl = document.createElement("button"); bl.className = "btn sm"; bl.textContent = "Link";
      bl.onclick = function () { copy(linkFor(it), "Link copied for " + (it.name || "item")); };
      var bp = document.createElement("button"); bp.className = "btn sm"; bp.textContent = "PNG";
      bp.onclick = function () { exportOne(it); };
      var bv = document.createElement("button"); bv.className = "btn sm"; bv.textContent = "Show";
      bv.onclick = function () {
        $("f-section").value = it.section; $("f-role").value = it.role; $("f-name").value = it.name;
        update(true); preview.scrollIntoView({ behavior: "smooth", block: "center" });
      };
      acts.appendChild(bv); acts.appendChild(bl); acts.appendChild(bp);
      row.appendChild(meta); row.appendChild(acts); list.appendChild(row);
    });
  }

  $("b-zip").onclick = function () {
    var items = programItems();
    if (!items.length) { toast("Add at least one line first."); return; }
    var zip = new JSZip(), used = {};
    toast("Making " + items.length + " PNGs…");
    items.reduce(function (p, it) {
      return p.then(function () {
        return renderPng(it).then(function (blob) {
          var n = fileName(it), k = 2;
          while (used[n]) n = fileName(it).replace(/\.png$/, " (" + (k++) + ").png");
          used[n] = 1; zip.file(n, blob);
        });
      });
    }, Promise.resolve())
      .then(function () { return zip.generateAsync({ type: "blob" }); })
      .then(function (blob) { download(blob, "lower-thirds.zip"); toast("Saved lower-thirds.zip"); })
      .catch(function () { toast("Couldn't make the ZIP here. Open this file on the Mac in Chrome or Safari."); });
  };

  // ---------- Helpers ----------
  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
  }
  function load() {
    try { var s = JSON.parse(localStorage.getItem("lt-maker") || "null"); if (s) return Object.assign({}, DEFAULTS, s); } catch (e) {}
    return Object.assign({}, DEFAULTS);
  }
  function save(s) { try { localStorage.setItem("lt-maker", JSON.stringify(s)); } catch (e) {} }

  update(false);
  waitForFonts().then(function () { update(true); });
})();
</script>
</body>
</html>
