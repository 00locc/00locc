<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lower Third Maker</title>
<style>
/*__FONTS__*/
:root {
  --ink: #16202e;
  --muted: #5b6676;
  --line: #d9dee6;
  --panel: #ffffff;
  --page: #f3f5f8;
  --brand: #1d4ed8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3442; --panel: #171c25; --page: #0f131a; --brand: #6c9bff;
  }
}
:root[data-theme="dark"] {
  --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3442; --panel: #171c25; --page: #0f131a; --brand: #6c9bff;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Montserrat", system-ui, sans-serif; background: var(--page); color: var(--ink); }

/* ---------- Overlay (what Wirecast shows) ---------- */
body.overlay-mode { background: transparent; overflow: hidden; }
.viewport { position: fixed; inset: 0; overflow: hidden; }
.stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  font-family: "Montserrat", sans-serif;
  --accent: #d4a63a;
  --plate: rgba(12, 22, 46, 0.93);
  --name: #ffffff;
  --role: var(--accent);
  --pill-bg: var(--accent);
  --pill-ink: #111827;
}
.lt {
  position: absolute; left: 130px; bottom: 105px;
  display: flex; flex-direction: column; align-items: flex-start;
  max-width: 1500px;
}
.pill {
  font-weight: 700; font-size: 21px; letter-spacing: .14em; text-transform: uppercase;
  background: var(--pill-bg); color: var(--pill-ink);
  padding: 7px 18px 6px; border-radius: 6px 6px 0 0; margin-left: 12px;
}
.pill:empty { display: none; }
.row { display: flex; align-items: stretch; position: relative; }
.row > .logo { position: absolute; top: calc(50% - var(--logo-h, 92px) / 2); z-index: 2; }
.bar { width: 12px; background: var(--accent); border-radius: 4px 0 0 4px; }
.plate {
  display: flex; align-items: center; gap: 26px;
  background: var(--plate);
  padding: 22px 46px 24px 30px;
  border-radius: 0 10px 10px 0;
  box-shadow: 0 10px 30px rgba(0,0,0,.28);
}
.logo { width: var(--logo-w, 92px); height: var(--logo-h, 92px); border-radius: 50%; background: #fff; padding: calc(min(var(--logo-w, 92px), var(--logo-h, 92px)) * 0.1); flex: none; display: none; }
.logo.on { display: block; }
.logo-img { width: 100%; height: 100%; background: center / contain no-repeat; }
.logo.bare { background: transparent; border-radius: 0; padding: 0; }
.logo.white .logo-img { filter: brightness(0) invert(1); }
.logo.stretch .logo-img { background-size: 100% 100%; }
.logo.free { position: absolute; z-index: 2; }
.preview .logo.on { cursor: grab; touch-action: none; }
.preview .logo.on:active { cursor: grabbing; }
.text { display: flex; flex-direction: column; min-width: 0; }
.name { font-weight: 700; font-size: 62px; line-height: 1.08; color: var(--name); white-space: nowrap; }
.role { font-weight: 600; font-size: 27px; letter-spacing: .13em; text-transform: uppercase; color: var(--role); margin-top: 6px; white-space: nowrap; }
.role:empty { display: none; }

/* Light theme */
.stage.t-light { --plate: rgba(255,255,255,0.96); --name: #0f1b33; --role: #8a6510; }
/* Minimal theme: no box, soft shadow along the bottom of the frame */
.stage.t-minimal .shade { position: absolute; inset: auto 0 0 0; height: 430px; background: linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,0)); }
.stage.t-minimal .plate { background: transparent; box-shadow: none; padding: 4px 0 4px 26px; }
.stage.t-minimal .bar { width: 6px; border-radius: 3px; }
.stage.t-minimal .pill { background: transparent; color: var(--accent); padding: 0 0 8px 0; margin-left: 32px; }
.stage.t-minimal .name { text-shadow: 0 2px 12px rgba(0,0,0,.45); }
.stage.t-minimal .role { color: #f1f1f1; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.shade { display: none; }
.stage.t-minimal .shade { display: block; }

/* Entrance animation */
.stage.animate .bar   { animation: barIn .35s cubic-bezier(.2,.8,.2,1) both; }
.stage.animate .plate { animation: wipe .55s .15s cubic-bezier(.2,.8,.2,1) both; }
.stage.animate .text, .stage.animate .logo { animation: rise .45s .45s ease-out both; }
.stage.animate .pill  { animation: fade .4s .6s ease-out both; }
.stage.animate .shade { animation: fade .6s ease-out both; }
@keyframes barIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes wipe  { from { clip-path: inset(-60px 100% -60px -60px); } to { clip-path: inset(-60px -90px -90px -60px); } }
@keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade  { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Maker (setup page) ---------- */
.maker { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.maker h1 { font-size: 22px; margin: 4px 0 2px; }
.maker h1 .ver { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 8px; vertical-align: middle; }
.maker .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
.grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card h2 { font-size: 15px; margin: 0 0 12px; }
input[type=range] { width: 100%; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .06em; }
.maker label .val { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink); margin-left: 6px; }
label.check { display: flex; gap: 8px; align-items: center; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); font-weight: 500; margin: 10px 0 0; cursor: pointer; }
input[type=text], select, textarea {
  width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--page);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
}
textarea { min-height: 170px; font-size: 13px; line-height: 1.5; resize: vertical; }
.inline { display: flex; gap: 10px; align-items: center; }
input[type=color] { width: 44px; height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--page); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches button { position: relative; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--panel); outline: 1px solid var(--line); cursor: pointer; padding: 0; }
.swatches .rm { position: absolute; top: -7px; right: -7px; width: 16px; height: 16px; border-radius: 50%; background: #111827; color: #fff; font-size: 10px; line-height: 16px; text-align: center; display: none; }
.swatches button.custom:hover .rm, .swatches button.custom:focus-visible .rm { display: block; }
details.more { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
details.more summary { cursor: pointer; font-size: 14px; font-weight: 600; }
details.more .inline { margin-top: 2px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn { font: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.sm { font-size: 12px; padding: 6px 10px; }
.preview { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(255,240,220,.55), transparent 60%),
    linear-gradient(180deg, #d9d2c6 0%, #b9ad9c 62%, #6d5e4c 63%, #4a3e31 100%); }
.preview .stage { position: absolute; }
.hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.addbox { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
.addbox h3 { font-size: 15px; margin: 0 0 4px; }
.item .x { color: var(--muted); }
.list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.item .meta { min-width: 0; font-size: 13px; }
.item .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta span { color: var(--muted); font-size: 12px; }
.item .acts { display: flex; gap: 6px; flex: none; }
#exportHost { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform: translateX(-200vw); pointer-events: none; }
</style>
</head>
<body>

<!-- The overlay graphic. In Wirecast (?name=...) only this is shown. -->
<template id="stageTpl">
  <div class="stage">
    <div class="shade"></div>
    <div class="lt">
      <div class="pill"></div>
      <div class="row">
        <div class="bar"></div>
        <div class="plate">
          <div class="logo"><div class="logo-img"></div></div>
          <div class="text">
            <div class="name"></div>
            <div class="role"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<div id="app"></div>
<div id="exportHost" aria-hidden="true"></div>
<div class="toast" id="toast"></div>

<script>/*__LIBS__*/</script>
<script>
(function () {
  "use strict";

  var THEMES = { royal: "Royal (dark plate)", light: "Light (white plate)", minimal: "Minimal (no box)" };
  var ACCENTS = ["#d4a63a", "#2bb3a3", "#3b82f6", "#c0392b", "#8e5bd8", "#e67e22"];
  var DEFAULTS = { section: "Sabbath School", role: "Opening Prayer", name: "Jane Mensah", theme: "royal", accent: "#d4a63a", logoW: 92, logoH: 92, logoKeep: true, logoBg: "circle", logoKnockout: false, logoWhite: false, logoX: null, logoY: null, logoPlace: "box", boxW: 0, boxH: 0 };
  var SAMPLE_PROGRAM = [
    "Sabbath School | Superintendent | Name Here",
    "Sabbath School | Facilitator | Name Here",
    "Sabbath School | Opening Prayer | Name Here",
    "Sabbath School | Closing Prayer | Name Here",
    "Divine Service | Scripture Reading | Name Here",
    "Divine Service | Special Song | Name Here",
    "Divine Service | Sermon | Name Here"
  ].join("\n");

  // ---------- Shared: build and fill one overlay ----------
  function makeStage() {
    return document.getElementById("stageTpl").content.firstElementChild.cloneNode(true);
  }

  function fillStage(stage, o) {
    stage.className = "stage t-" + (THEMES[o.theme] ? o.theme : "royal");
    stage.style.setProperty("--accent", o.accent || DEFAULTS.accent);
    // Tag text: dark on light accents, white on dark ones.
    var am = /^#?([0-9a-f]{6})$/i.exec(o.accent || DEFAULTS.accent), lum = 1;
    if (am) { var an = parseInt(am[1], 16); lum = (0.299 * (an >> 16) + 0.587 * ((an >> 8) & 255) + 0.114 * (an & 255)) / 255; }
    stage.style.setProperty("--pill-ink", lum < 0.55 ? "#ffffff" : "#111827");
    stage.querySelector(".pill").textContent = o.section || "";
    stage.querySelector(".name").textContent = o.name || "";
    stage.querySelector(".role").textContent = o.role || "";
    var hexA = function (hex, a) {
      var m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "";
      var n = parseInt(m[1], 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
    };
    stage.querySelector(".plate").style.background = (o.plateColor && o.theme !== "minimal") ? hexA(o.plateColor, o.theme === "light" ? 0.96 : 0.93) : "";
    stage.querySelector(".name").style.color = o.nameColor || "";
    stage.querySelector(".role").style.color = o.roleColor || "";
    var logo = stage.querySelector(".logo");
    logo.classList.toggle("on", !!o.logoSrc);
    logo.classList.toggle("bare", o.logoBg === "none");
    logo.classList.toggle("white", !!o.logoWhite);
    var lw = +o.logoW || +o.logoSize || 92, lh = +o.logoH || +o.logoSize || 92;
    logo.style.setProperty("--logo-w", lw + "px");
    logo.style.setProperty("--logo-h", lh + "px");
    logo.classList.toggle("stretch", !!o.logoStretch);
    logo.querySelector(".logo-img").style.backgroundImage = o.logoSrc ? 'url("' + o.logoSrc + '")' : "";
    // Logo sits in the name box unless it has been dragged to its own spot on the frame.
    // In the name box, the logo overlays the box (so it never makes the box taller);
    // the text moves right to make room, so the box gets wider instead.
    var plate = stage.querySelector(".plate"), row = stage.querySelector(".row"), pill = stage.querySelector(".pill");
    var size = lw, minimal = stage.classList.contains("t-minimal");
    var barW = minimal ? 6 : 12, padL = minimal ? 26 : 30;
    plate.style.paddingLeft = ""; plate.style.paddingRight = ""; pill.style.marginLeft = ""; logo.style.right = "";
    plate.style.minWidth = +o.boxW > 0 ? o.boxW + "px" : "";
    plate.style.minHeight = +o.boxH > 0 ? o.boxH + "px" : "";
    if (typeof o.logoX === "number" && typeof o.logoY === "number") {
      if (logo.parentNode !== stage) stage.appendChild(logo);
      logo.classList.add("free");
      logo.style.left = o.logoX + "px"; logo.style.top = o.logoY + "px";
    } else {
      if (logo.parentNode !== row) row.appendChild(logo);
      logo.classList.remove("free");
      logo.style.top = "";
      if (o.logoSide === "right") {
        // Logo on the right of the box; the name stays on the left.
        var padR = minimal ? 10 : 30;
        logo.style.left = ""; logo.style.right = padR + "px";
        if (o.logoSrc) plate.style.paddingRight = (padR + size + 26) + "px";
      } else {
        logo.style.left = (barW + padL) + "px";
        if (o.logoSrc) {
          plate.style.paddingLeft = (padL + size + 26) + "px";
          pill.style.marginLeft = (barW + padL + size + 26) + "px";
        }
      }
    }
    fitText(stage);
  }

  // Shrink long names so the plate never runs off screen.
  function fitText(stage) {
    var name = stage.querySelector(".name"), role = stage.querySelector(".role");
    var max = 1380;
    [[name, 62, 38], [role, 27, 18]].forEach(function (t) {
      var el = t[0], size = t[1];
      el.style.fontSize = size + "px"; el.style.whiteSpace = ""; el.style.maxWidth = "";
      while (el.scrollWidth > max && size > t[2]) { size -= 2; el.style.fontSize = size + "px"; }
      if (el.scrollWidth > max) { el.style.whiteSpace = "normal"; el.style.maxWidth = max + "px"; }
    });
  }

  function scaleTo(stage, box) {
    var s = Math.min(box.clientWidth / 1920, box.clientHeight / 1080);
    stage.style.transform = "scale(" + s + ")";
  }

  function replay(stage) {
    stage.classList.remove("animate");
    void stage.offsetWidth;
    stage.classList.add("animate");
  }

  function waitForFonts() {
    return (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  }

  var params = new URLSearchParams(location.search);

  // ---------- Overlay mode: Wirecast Web Page shot ----------
  if (params.has("name") || params.has("role")) {
    document.body.classList.add("overlay-mode");
    var vp = document.createElement("div");
    vp.className = "viewport";
    var stage = makeStage();
    vp.appendChild(stage);
    document.getElementById("app").appendChild(vp);
    var logoParam = params.get("logo");
    fillStage(stage, {
      section: params.get("section") || "",
      role: params.get("role") || "",
      name: params.get("name") || "",
      theme: params.get("theme") || "royal",
      accent: params.get("accent") ? "#" + params.get("accent").replace(/^#/, "") : DEFAULTS.accent,
      plateColor: params.get("platecolor") ? "#" + params.get("platecolor") : "",
      nameColor: params.get("namecolor") ? "#" + params.get("namecolor") : "",
      roleColor: params.get("rolecolor") ? "#" + params.get("rolecolor") : "",
      logoSrc: logoParam ? (logoParam === "1" ? "logo.png" : logoParam) : "",
      logoW: +(params.get("logow") || params.get("logosize") || 92),
      logoH: +(params.get("logoh") || params.get("logosize") || 92),
      logoStretch: params.get("logostretch") === "1",
      logoSide: params.get("logoside") === "right" ? "right" : "left",
      boxW: +(params.get("boxw") || 0),
      boxH: +(params.get("boxh") || 0),
      logoBg: params.get("logobg") || "circle",
      logoWhite: params.get("logocolor") === "white",
      logoX: params.has("logox") ? +params.get("logox") : null,
      logoY: params.has("logoy") ? +params.get("logoy") : null
    });
    var fit = function () { scaleTo(stage, vp); };
    fit();
    window.addEventListener("resize", fit);
    waitForFonts().then(function () {
      fitText(stage);
      if (params.get("anim") !== "0") replay(stage);
    });
    return;
  }

  // ---------- Maker mode ----------
  var state = load();
  var logoOriginal = "", logoData = "";
  var logoPos = (typeof state.logoX === "number" && typeof state.logoY === "number") ? { x: state.logoX, y: state.logoY } : null;
  try { logoOriginal = localStorage.getItem("lt-logo") || ""; } catch (e) {}

  var app = document.getElementById("app");
  app.innerHTML =
    '<div class="maker">' +
      '<h1>Lower Third Maker <span class="ver">Version 8</span></h1>' +
      '<p class="sub">Type a name and role, pick a look, then <b>Copy Wirecast link</b> (for an animated Web Page shot) or <b>Download PNG</b> (a still image you can drag into Wirecast).</p>' +
      '<div class="grid">' +
        '<div class="card">' +
          '<h2>Details</h2>' +
          '<label for="f-section">Section tag</label><input type="text" id="f-section" placeholder="e.g. Divine Service">' +
          '<label for="f-role">Role</label><input type="text" id="f-role" placeholder="e.g. Scripture Reading">' +
          '<label for="f-name">Name</label><input type="text" id="f-name" placeholder="e.g. Elder Kwame Asante">' +
          '<label for="f-theme">Look</label><select id="f-theme"></select>' +
          '<label>Accent colour</label>' +
          '<div class="inline"><input type="color" id="f-accent"><div class="swatches" id="swatches"></div></div>' +
          '<div class="btns" style="margin-top:8px"><button class="btn sm" type="button" id="b-addcolor">+ Save this colour</button></div>' +
          '<div class="hint">Pick any colour with the square, then save it to the row. Hover a saved colour and click × to remove it.</div>' +
          '<details class="more"><summary>More colours</summary>' +
            '<label for="c-plate">Box colour</label><div class="inline"><input type="color" id="c-plate"><button class="btn sm" type="button" data-reset="plate">Reset</button></div>' +
            '<label for="c-name">Name colour</label><div class="inline"><input type="color" id="c-name"><button class="btn sm" type="button" data-reset="name">Reset</button></div>' +
            '<label for="c-role">Role colour</label><div class="inline"><input type="color" id="c-role"><button class="btn sm" type="button" data-reset="role">Reset</button></div>' +
          '</details>' +
          '<label for="f-boxw">Box width<span class="val" id="v-boxw"></span></label><input type="range" id="f-boxw" min="0" max="1600" step="10">' +
          '<label for="f-boxh">Box height<span class="val" id="v-boxh"></span></label><input type="range" id="f-boxh" min="0" max="400" step="4">' +
          '<div class="hint">All the way left = the box fits the text by itself.</div>' +
          '<label for="f-logo">Logo (optional, PNG)</label>' +
          '<input type="file" id="f-logo" accept="image/png,image/jpeg,image/svg+xml">' +
          '<div id="logoOpts" hidden>' +
            '<label for="f-logow">Logo width<span class="val" id="v-logow"></span></label><input type="range" id="f-logow" min="30" max="500" step="2">' +
            '<label for="f-logoh">Logo height<span class="val" id="v-logoh"></span></label><input type="range" id="f-logoh" min="30" max="400" step="2">' +
            '<label class="check"><input type="checkbox" id="f-logokeep"> Keep the logo\'s shape (width and height move together)</label>' +
            '<label for="f-logobg">Behind the logo</label>' +
            '<select id="f-logobg"><option value="circle">White circle</option><option value="none">Nothing (transparent)</option></select>' +
            '<label class="check"><input type="checkbox" id="f-logoknock"> Remove white background from the logo image</label>' +
            '<label class="check"><input type="checkbox" id="f-logowhite"> Make the logo all white</label>' +
            '<label for="f-logoplace">Logo position</label>' +
            '<select id="f-logoplace"><option value="box">Left side of the name box</option><option value="boxright">Right side of the name box</option>' +
            '<option value="tr">Top right corner</option>' +
            '<option value="tl">Top left corner</option><option value="custom">Where I dragged it</option></select>' +
            '<div class="hint">Or drag the logo in the preview: drop it on the left or right half of the name box and the name moves aside, or drop it anywhere else on the screen.</div>' +
            '<div class="btns"><button class="btn sm" type="button" id="b-logoclear">Remove logo</button></div>' +
          '</div>' +
          '<div class="hint">The maker remembers your logo. For the Wirecast link, also save it as <b>logo.png</b> in the same folder as this file.</div>' +
          '<div class="btns">' +
            '<button class="btn primary" id="b-copy">Copy Wirecast link</button>' +
            '<button class="btn" id="b-png">Download PNG</button>' +
            '<button class="btn" id="b-play">Replay animation</button>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="card"><h2>Preview</h2><div class="preview" id="preview"></div>' +
            '<div class="hint">Preview of a 1920×1080 frame. The background here is a stand-in; in Wirecast the overlay sits on your camera.</div></div>' +
          '<div class="card" style="margin-top:18px">' +
            '<h2>Whole service at once</h2>' +
            '<div class="hint" style="margin:0 0 8px">One per line: <b>Section | Role | Name</b>. Uses the look and colour chosen above.</div>' +
            '<textarea id="f-program" spellcheck="false"></textarea>' +
            '<div class="btns"><button class="btn primary" id="b-zip">Download all PNGs (ZIP)</button></div>' +
            '<div class="list" id="list"></div>' +
            '<div class="addbox">' +
              '<h3>Add an overlay</h3>' +
              '<div class="hint" style="margin:0">For anything else: a welcome message, a hymn number, an announcement…</div>' +
              '<label for="a-tag">Small tag on top (optional)</label><input type="text" id="a-tag" placeholder="e.g. Announcement">' +
              '<label for="a-main">Main text</label><input type="text" id="a-main" placeholder="e.g. Welcome to our livestream">' +
              '<label for="a-sub">Line underneath (optional)</label><input type="text" id="a-sub" placeholder="e.g. Hymn 123">' +
              '<div class="btns"><button class="btn primary" type="button" id="b-add">+ Add overlay</button></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  var $ = function (id) { return document.getElementById(id); };
  var themeSel = $("f-theme");
  Object.keys(THEMES).forEach(function (k) {
    var o = document.createElement("option"); o.value = k; o.textContent = THEMES[k]; themeSel.appendChild(o);
  });
  var customColors = Array.isArray(state.customColors) ? state.customColors.slice() : [];
  var extraColors = { plate: state.plateColor || "", name: state.nameColor || "", role: state.roleColor || "" };
  function renderSwatches() {
    var box = $("swatches"); box.innerHTML = "";
    ACCENTS.concat(customColors).forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button"; b.style.background = c; b.title = c; b.setAttribute("aria-label", "Accent " + c);
      b.onclick = function () { $("f-accent").value = c; update(); };
      if (i >= ACCENTS.length) {
        b.className = "custom";
        var rm = document.createElement("span"); rm.className = "rm"; rm.textContent = "×"; rm.title = "Remove this colour";
        rm.onclick = function (e) {
          e.stopPropagation();
          customColors.splice(customColors.indexOf(c), 1);
          renderSwatches(); update(false);
        };
        b.appendChild(rm);
      }
      box.appendChild(b);
    });
  }
  renderSwatches();

  $("f-section").value = state.section; $("f-role").value = state.role; $("f-name").value = state.name;
  themeSel.value = state.theme; $("f-accent").value = state.accent; $("f-program").value = state.program || SAMPLE_PROGRAM;
  $("f-logow").value = state.logoW; $("f-logoh").value = state.logoH; $("f-logokeep").checked = state.logoKeep !== false;
  $("f-boxw").value = state.boxW; $("f-boxh").value = state.boxH;
  $("f-logobg").value = state.logoBg;
  $("f-logoknock").checked = !!state.logoKnockout; $("f-logowhite").checked = !!state.logoWhite;
  $("f-logoplace").value = logoPos
    ? (["tr", "tl", "custom"].indexOf(state.logoPlace) >= 0 ? state.logoPlace : "custom")
    : (state.logoPlace === "boxright" ? "boxright" : "box");

  var preview = $("preview");
  var pStage = makeStage();
  preview.appendChild(pStage);

  function current() {
    return {
      section: $("f-section").value.trim(), role: $("f-role").value.trim(), name: $("f-name").value.trim(),
      theme: themeSel.value, accent: $("f-accent").value, logoSrc: logoData,
      plateColor: extraColors.plate, nameColor: extraColors.name, roleColor: extraColors.role,
      logoW: +$("f-logow").value, logoH: +$("f-logoh").value, logoKeep: $("f-logokeep").checked,
      logoStretch: !$("f-logokeep").checked, boxW: +$("f-boxw").value, boxH: +$("f-boxh").value,
      logoBg: $("f-logobg").value,
      logoKnockout: $("f-logoknock").checked, logoWhite: $("f-logowhite").checked,
      logoX: logoPos ? logoPos.x : null, logoY: logoPos ? logoPos.y : null,
      logoSide: $("f-logoplace").value === "boxright" ? "right" : "left"
    };
  }

  function update(animate) {
    var o = current();
    fillStage(pStage, o);
    scaleTo(pStage, preview);
    if (animate) replay(pStage);
    $("logoOpts").hidden = !logoData;
    $("v-logow").textContent = o.logoW + " px"; $("v-logoh").textContent = o.logoH + " px";
    $("v-boxw").textContent = o.boxW > 0 ? o.boxW + " px" : "auto";
    $("v-boxh").textContent = o.boxH > 0 ? o.boxH + " px" : "auto";
    state = { section: o.section, role: o.role, name: o.name, theme: o.theme, accent: o.accent, program: $("f-program").value,
      logoW: o.logoW, logoH: o.logoH, logoKeep: o.logoKeep, boxW: o.boxW, boxH: o.boxH,
      logoBg: o.logoBg, logoKnockout: o.logoKnockout, logoWhite: o.logoWhite,
      logoX: o.logoX, logoY: o.logoY, logoPlace: $("f-logoplace").value,
      customColors: customColors, plateColor: extraColors.plate, nameColor: extraColors.name, roleColor: extraColors.role };
    // Pickers show the current colour, or the look's default when not changed.
    $("c-plate").value = extraColors.plate || (o.theme === "light" ? "#ffffff" : "#0c162e");
    $("c-name").value = extraColors.name || (o.theme === "light" ? "#0f1b33" : "#ffffff");
    $("c-role").value = extraColors.role || (o.theme === "light" ? "#8a6510" : o.theme === "minimal" ? "#f1f1f1" : o.accent);
    save(state);
    renderList();
  }

  ["f-section", "f-role", "f-name", "f-accent"].forEach(function (id) { $(id).addEventListener("input", function () { update(false); }); });
  $("b-addcolor").onclick = function () {
    var c = $("f-accent").value.toLowerCase();
    if (ACCENTS.indexOf(c) >= 0 || customColors.indexOf(c) >= 0) { toast("That colour is already in the row."); return; }
    customColors.push(c); renderSwatches(); update(false); toast("Colour saved.");
  };
  ["plate", "name", "role"].forEach(function (k) {
    $("c-" + k).addEventListener("input", function () { extraColors[k] = $("c-" + k).value; update(false); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-reset]"), function (b) {
    b.onclick = function () { extraColors[b.getAttribute("data-reset")] = ""; update(false); };
  });
  themeSel.addEventListener("change", function () { update(true); });
  $("f-program").addEventListener("input", function () { update(false); });
  // Logo: keep the original, derive the shown version (optionally with white knocked out).
  function knockOutWhite(src) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth || 512, h = img.naturalHeight || 512, k = Math.min(1, 1024 / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
        var x = c.getContext("2d"); x.drawImage(img, 0, 0, c.width, c.height);
        try {
          var d = x.getImageData(0, 0, c.width, c.height), px = d.data;
          for (var i = 0; i < px.length; i += 4) {
            var m = Math.min(px[i], px[i + 1], px[i + 2]);
            if (m > 200) px[i + 3] = Math.round(px[i + 3] * Math.max(0, (245 - m) / 45));
          }
          x.putImageData(d, 0, 0);
          resolve(c.toDataURL("image/png"));
        } catch (e) { resolve(src); }
      };
      img.onerror = function () { resolve(src); };
      img.src = src;
    });
  }
  var logoAspect = 1;  // width / height of the uploaded logo image
  function measureLogo(src, cb) {
    var img = new Image();
    img.onload = function () { logoAspect = (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 1; cb(); };
    img.onerror = function () { cb(); };
    img.src = src;
  }
  function fitHeightToWidth() {
    var w = +$("f-logow").value;
    $("f-logoh").value = Math.round(w / logoAspect);
  }
  function refreshLogo(animate) {
    if (!logoOriginal) { logoData = ""; update(animate); return; }
    var p = $("f-logoknock").checked ? knockOutWhite(logoOriginal) : Promise.resolve(logoOriginal);
    p.then(function (src) { logoData = src; update(animate); });
  }
  $("f-logo").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      logoOriginal = r.result;
      try { localStorage.setItem("lt-logo", logoOriginal); } catch (err) {}
      measureLogo(logoOriginal, function () {
        // Start a new logo at a normal height, with its width following its shape.
        var h = 92, w = Math.round(h * logoAspect);
        if (w > 500) { w = 500; h = Math.round(w / logoAspect); }
        $("f-logow").value = Math.max(30, w); $("f-logoh").value = Math.max(30, h);
        refreshLogo(true);
      });
    };
    r.readAsDataURL(f);
  });
  // Corner positions depend on the logo size, so they are recomputed when it changes.
  function placeLogo() {
    var size = +$("f-logow").value, place = $("f-logoplace").value;
    if (place === "tr") logoPos = { x: 1920 - size - 80, y: 60 };
    else if (place === "tl") logoPos = { x: 80, y: 60 };
    else if (place === "box" || place === "boxright") logoPos = null;
    else if (!logoPos) logoPos = { x: 1920 - size - 80, y: 60 };
  }
  $("f-logoplace").addEventListener("change", function () { placeLogo(); update(true); });
  $("f-logow").addEventListener("input", function () {
    if ($("f-logokeep").checked) fitHeightToWidth();
    placeLogo(); update(false);
  });
  $("f-logoh").addEventListener("input", function () {
    if ($("f-logokeep").checked) $("f-logow").value = Math.round(+$("f-logoh").value * logoAspect);
    placeLogo(); update(false);
  });
  $("f-logokeep").addEventListener("change", function () {
    if ($("f-logokeep").checked) fitHeightToWidth();
    placeLogo(); update(false);
  });
  ["f-boxw", "f-boxh"].forEach(function (id) { $(id).addEventListener("input", function () { update(false); }); });
  ["f-logobg", "f-logowhite"].forEach(function (id) { $(id).addEventListener("change", function () { update(false); }); });
  $("f-logoknock").addEventListener("change", function () { refreshLogo(false); });
  // Drag the logo around the preview (positions are stored in 1920x1080 frame pixels).
  preview.addEventListener("pointerdown", function (e) {
    var lg = e.target.closest && e.target.closest(".logo");
    if (!lg || !logoData) return;
    e.preventDefault();
    var sr = pStage.getBoundingClientRect(), lr = lg.getBoundingClientRect();
    var k = sr.width / 1920;
    var startX = (lr.left - sr.left) / k, startY = (lr.top - sr.top) / k;
    var px = e.clientX, py = e.clientY;
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function move(ev) {
      var lw = +$("f-logow").value, lh = +$("f-logoh").value;
      var place = $("f-logoplace");
      // Over the name box: snap into its left or right side and let the name move aside.
      var rr = pStage.querySelector(".row").getBoundingClientRect(), m = 20 * k;
      var cx = ev.clientX, cy = ev.clientY;
      if (cx >= rr.left - m && cx <= rr.right + m && cy >= rr.top - m && cy <= rr.bottom + m) {
        var f = (cx - rr.left) / rr.width;
        var side = place.value === "boxright" ? (f < 0.4 ? "box" : "boxright")
                 : place.value === "box" ? (f > 0.6 ? "boxright" : "box")
                 : (f < 0.5 ? "box" : "boxright");
        logoPos = null; place.value = side;
      } else {
        logoPos = {
          x: clamp(Math.round(startX + (ev.clientX - px) / k), 0, 1920 - lw),
          y: clamp(Math.round(startY + (ev.clientY - py) / k), 0, 1080 - lh)
        };
        place.value = "custom";
      }
      update(false);
    }
    function up() {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
    }
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
  });
  $("b-logoclear").onclick = function () {
    logoOriginal = ""; $("f-logo").value = "";
    try { localStorage.removeItem("lt-logo"); } catch (e) {}
    refreshLogo(false);
  };
  window.addEventListener("resize", function () { scaleTo(pStage, preview); });

  // ---------- Links for Wirecast ----------
  function linkFor(o) {
    var base = location.href.split(/[?#]/)[0];
    var q = new URLSearchParams();
    if (o.section) q.set("section", o.section);
    if (o.role) q.set("role", o.role);
    q.set("name", o.name || "");
    q.set("theme", o.theme);
    q.set("accent", o.accent.replace("#", ""));
    if (o.boxW > 0) q.set("boxw", o.boxW);
    if (o.plateColor) q.set("platecolor", o.plateColor.replace("#", ""));
    if (o.nameColor) q.set("namecolor", o.nameColor.replace("#", ""));
    if (o.roleColor) q.set("rolecolor", o.roleColor.replace("#", ""));
    if (o.boxH > 0) q.set("boxh", o.boxH);
    if (o.logoSrc) {
      q.set("logo", "1");
      q.set("logow", o.logoW); q.set("logoh", o.logoH);
      if (o.logoStretch) q.set("logostretch", "1");
      if (o.logoBg === "none") q.set("logobg", "none");
      if (o.logoWhite) q.set("logocolor", "white");
      if (typeof o.logoX === "number") { q.set("logox", o.logoX); q.set("logoy", o.logoY); }
      else if (o.logoSide === "right") q.set("logoside", "right");
    }
    return base + "?" + q.toString();
  }

  function copy(text, okMsg) {
    var done = function () { toast(okMsg); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) {
    var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (e) {}
    t.remove();
  }

  $("b-copy").onclick = function () { copy(linkFor(current()), "Link copied. In Wirecast: + → Web Page → paste."); };
  $("b-play").onclick = function () { replay(pStage); };

  // ---------- PNG export (transparent background) ----------
  var exportHost = $("exportHost");
  function renderPng(o) {
    exportHost.innerHTML = "";
    var st = makeStage();
    exportHost.appendChild(st);
    fillStage(st, o);
    return waitForFonts().then(function () {
      fitText(st);
      return htmlToImage.toBlob(st, { width: 1920, height: 1080, pixelRatio: 1, style: { transform: "none" } });
    });
  }

  function fileName(o) {
    var s = [o.section, o.role, o.name].filter(Boolean).join(" - ") || "lower-third";
    return s.replace(/[\\/:*?"<>|]+/g, "").slice(0, 120) + ".png";
  }

  function download(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  function exportOne(o) {
    toast("Making PNG…");
    renderPng(o).then(function (blob) { download(blob, fileName(o)); toast("PNG saved: " + fileName(o)); })
      .catch(function () { toast("Couldn't make the PNG here. Open this file on the Mac in Chrome or Safari."); });
  }
  $("b-png").onclick = function () { exportOne(current()); };

  // ---------- Program list ----------
  function programItems() {
    var base = current();
    return $("f-program").value.split("\n").map(function (line, idx) {
      var p = line.split("|").map(function (s) { return s.trim(); });
      if (!line.trim()) return null;
      if (p.length === 1) return { line: idx, section: "", role: "", name: p[0] };
      if (p.length === 2) return { line: idx, section: "", role: p[0], name: p[1] };
      return { line: idx, section: p[0], role: p[1], name: p.slice(2).join(" | ") };
    }).filter(Boolean).map(function (it) {
      ["theme", "accent", "logoSrc", "logoW", "logoH", "logoStretch", "logoBg", "logoWhite", "logoX", "logoY", "logoSide", "boxW", "boxH", "plateColor", "nameColor", "roleColor"].forEach(function (k) { it[k] = base[k]; });
      return it;
    });
  }

  function renderList() {
    var list = $("list");
    list.innerHTML = "";
    programItems().forEach(function (it) {
      var row = document.createElement("div"); row.className = "item";
      var meta = document.createElement("div"); meta.className = "meta";
      var b = document.createElement("b"); b.textContent = it.name || "(no name)";
      var s = document.createElement("span"); s.textContent = [it.section, it.role].filter(Boolean).join(" · ");
      meta.appendChild(b); meta.appendChild(s);
      var acts = document.createElement("div"); acts.className = "acts";
      var bl = document.createElement("button"); bl.className = "btn sm"; bl.textContent = "Link";
      bl.onclick = function () { copy(linkFor(it), "Link copied for " + (it.name || "item")); };
      var bp = document.createElement("button"); bp.className = "btn sm"; bp.textContent = "PNG";
      bp.onclick = function () { exportOne(it); };
      var bv = document.createElement("button"); bv.className = "btn sm"; bv.textContent = "Show";
      bv.onclick = function () {
        $("f-section").value = it.section; $("f-role").value = it.role; $("f-name").value = it.name;
        update(true); preview.scrollIntoView({ behavior: "smooth", block: "center" });
      };
      var bx = document.createElement("button"); bx.className = "btn sm x"; bx.textContent = "✕";
      bx.title = "Remove from the list"; bx.setAttribute("aria-label", "Remove " + (it.name || "item"));
      bx.onclick = function () {
        var lines = $("f-program").value.split("\n");
        lines.splice(it.line, 1);
        $("f-program").value = lines.join("\n");
        update(false);
      };
      acts.appendChild(bv); acts.appendChild(bl); acts.appendChild(bp); acts.appendChild(bx);
      row.appendChild(meta); row.appendChild(acts); list.appendChild(row);
    });
  }

  $("b-add").onclick = function () {
    var clean = function (id) { return $(id).value.replace(/\|/g, "/").trim(); };
    var tag = clean("a-tag"), main = clean("a-main"), sub = clean("a-sub");
    if (!main) { toast("Type the main text first."); $("a-main").focus(); return; }
    var text = $("f-program").value.replace(/\s+$/, "");
    $("f-program").value = (text ? text + "\n" : "") + tag + " | " + sub + " | " + main;
    ["a-tag", "a-main", "a-sub"].forEach(function (id) { $(id).value = ""; });
    update(false);
    toast("Added: " + main);
    var rows = $("list").children; if (rows.length) rows[rows.length - 1].scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  $("b-zip").onclick = function () {
    var items = programItems();
    if (!items.length) { toast("Add at least one line first."); return; }
    var zip = new JSZip(), used = {};
    toast("Making " + items.length + " PNGs…");
    items.reduce(function (p, it) {
      return p.then(function () {
        return renderPng(it).then(function (blob) {
          var n = fileName(it), k = 2;
          while (used[n]) n = fileName(it).replace(/\.png$/, " (" + (k++) + ").png");
          used[n] = 1; zip.file(n, blob);
        });
      });
    }, Promise.resolve())
      .then(function () { return zip.generateAsync({ type: "blob" }); })
      .then(function (blob) { download(blob, "lower-thirds.zip"); toast("Saved lower-thirds.zip"); })
      .catch(function () { toast("Couldn't make the ZIP here. Open this file on the Mac in Chrome or Safari."); });
  };

  // ---------- Helpers ----------
  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem("lt-maker") || "null");
      if (s) {
        if (s.logoSize && !s.logoW) { s.logoW = s.logoH = s.logoSize; }  // older versions had one size
        return Object.assign({}, DEFAULTS, s);
      }
    } catch (e) {}
    return Object.assign({}, DEFAULTS);
  }
  function save(s) { try { localStorage.setItem("lt-maker", JSON.stringify(s)); } catch (e) {} }

  if (logoOriginal) measureLogo(logoOriginal, function () {});
  refreshLogo(false);
  waitForFonts().then(function () { update(true); });
})();
</script>
</body>
</html>
