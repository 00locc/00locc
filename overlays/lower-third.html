:root {
  --ink: #16202e;
  --muted: #5b6676;
  --line: #d9dee6;
  --panel: #ffffff;
  --page: #f3f5f8;
  --brand: #1d4ed8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3442; --panel: #171c25; --page: #0f131a; --brand: #6c9bff;
  }
}
:root[data-theme="dark"] {
  --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3442; --panel: #171c25; --page: #0f131a; --brand: #6c9bff;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Montserrat", system-ui, sans-serif; background: var(--page); color: var(--ink); }

/* ---------- Overlay (what Wirecast shows) ---------- */
body.overlay-mode { background: transparent; overflow: hidden; }
.viewport { position: fixed; inset: 0; overflow: hidden; }
.stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  font-family: "Montserrat", sans-serif;
  --accent: #d4a63a;
  --plate: rgba(12, 22, 46, 0.93);
  --name: #ffffff;
  --role: var(--accent);
  --pill-bg: var(--accent);
  --pill-ink: #111827;
}
.lt {
  position: absolute; left: 130px; bottom: 105px;
  display: flex; flex-direction: column; align-items: flex-start;
  max-width: 1500px;
}
.pill {
  font-weight: 700; font-size: 21px; letter-spacing: .14em; text-transform: uppercase;
  background: var(--pill-bg); color: var(--pill-ink);
  padding: 7px 18px 6px; border-radius: 6px 6px 0 0; margin-left: 12px;
}
.pill:empty { display: none; }
.row { display: flex; align-items: stretch; position: relative; }
.row > .logo { position: absolute; top: calc(50% - var(--logo-h, 92px) / 2); z-index: 2; }
.bar { width: 12px; background: var(--accent); border-radius: 4px 0 0 4px; }
.plate {
  display: flex; align-items: center; gap: 26px;
  background: var(--plate);
  padding: 22px 46px 24px 30px;
  border-radius: 0 10px 10px 0;
  box-shadow: 0 10px 30px rgba(0,0,0,.28);
}
.logo { width: var(--logo-w, 92px); height: var(--logo-h, 92px); border-radius: 50%; background: #fff; padding: calc(min(var(--logo-w, 92px), var(--logo-h, 92px)) * 0.1); flex: none; display: none; }
.logo.on { display: block; }
.logo-img { width: 100%; height: 100%; background: center / contain no-repeat; }
.logo.bare { background: transparent; border-radius: 0; padding: 0; }
.logo.white .logo-img { filter: brightness(0) invert(1); }
.logo.stretch .logo-img { background-size: 100% 100%; }
.logo.free { position: absolute; z-index: 2; }
.preview .logo.on { cursor: grab; touch-action: none; }
.preview .logo.on:active { cursor: grabbing; }
.text { display: flex; flex-direction: column; min-width: 0; }
.name { font-weight: 700; font-size: 62px; line-height: 1.08; color: var(--name); white-space: nowrap; }
.role { font-weight: 600; font-size: 27px; letter-spacing: .13em; text-transform: uppercase; color: var(--role); margin-top: 6px; white-space: nowrap; }
.role:empty { display: none; }

/* Light theme */
.stage.t-light { --plate: rgba(255,255,255,0.96); --name: #0f1b33; --role: #8a6510; }
/* Minimal theme: no box, soft shadow along the bottom of the frame */
.stage.t-minimal .shade { position: absolute; inset: auto 0 0 0; height: 430px; background: linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,0)); }
.stage.t-minimal .plate { background: transparent; box-shadow: none; padding: 4px 0 4px 26px; }
.stage.t-minimal .bar { width: 6px; border-radius: 3px; }
.stage.t-minimal .pill { background: transparent; color: var(--accent); padding: 0 0 8px 0; margin-left: 32px; }
.stage.t-minimal .name { text-shadow: 0 2px 12px rgba(0,0,0,.45); }
.stage.t-minimal .role { color: #f1f1f1; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.shade { display: none; }
.stage.t-minimal .shade { display: block; }

/* Entrance animation */
.stage.animate .bar   { animation: barIn .35s cubic-bezier(.2,.8,.2,1) both; }
.stage.animate .plate { animation: wipe .55s .15s cubic-bezier(.2,.8,.2,1) both; }
.stage.animate .text, .stage.animate .logo { animation: rise .45s .45s ease-out both; }
.stage.animate .pill  { animation: fade .4s .6s ease-out both; }
.stage.animate .shade { animation: fade .6s ease-out both; }
@keyframes barIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes wipe  { from { clip-path: inset(-60px 100% -60px -60px); } to { clip-path: inset(-60px -90px -90px -60px); } }
@keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade  { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Maker (setup page) ---------- */
.maker { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.maker h1 { font-size: 22px; margin: 4px 0 2px; }
.maker h1 .ver { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 8px; vertical-align: middle; }
.maker .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
.grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card h2 { font-size: 15px; margin: 0 0 12px; }
input[type=range] { width: 100%; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .06em; }
.maker label .val { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink); margin-left: 6px; }
label.check { display: flex; gap: 8px; align-items: center; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); font-weight: 500; margin: 10px 0 0; cursor: pointer; }
input[type=text], select, textarea {
  width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--page);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
}
textarea { min-height: 170px; font-size: 13px; line-height: 1.5; resize: vertical; }
.inline { display: flex; gap: 10px; align-items: center; }
input[type=color] { width: 44px; height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--page); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches button { position: relative; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--panel); outline: 1px solid var(--line); cursor: pointer; padding: 0; }
.swatches .rm { position: absolute; top: -7px; right: -7px; width: 16px; height: 16px; border-radius: 50%; background: #111827; color: #fff; font-size: 10px; line-height: 16px; text-align: center; display: none; }
.swatches button.custom:hover .rm, .swatches button.custom:focus-visible .rm { display: block; }
details.more { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
details.more summary { cursor: pointer; font-size: 14px; font-weight: 600; }
details.more .inline { margin-top: 2px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn { font: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.sm { font-size: 12px; padding: 6px 10px; }
.preview { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(255,240,220,.55), transparent 60%),
    linear-gradient(180deg, #d9d2c6 0%, #b9ad9c 62%, #6d5e4c 63%, #4a3e31 100%); }
.preview .stage { position: absolute; }
.hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.addbox { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
.addbox h3 { font-size: 15px; margin: 0 0 4px; }
.item .x { color: var(--muted); }
.list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.item .meta { min-width: 0; font-size: 13px; }
.item .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta span { color: var(--muted); font-size: 12px; }
.item .acts { display: flex; gap: 6px; flex: none; }
#exportHost { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform: translateX(-200vw); pointer-events: none; }
</style>
</head>
<body>

<!-- The overlay graphic. In Wirecast (?name=...) only this is shown. -->
<template id="stageTpl">
  <div class="stage">
    <div class="shade"></div>
    <div class="lt">
      <div class="pill"></div>
      <div class="row">
        <div class="bar"></div>
        <div class="plate">
          <div class="logo"><div class="logo-img"></div></div>
          <div class="text">
            <div class="name"></div>
            <div class="role"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<div id="app"></div>
<div id="exportHost" aria-hidden="true"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var THEMES = { royal: "Royal (dark plate)", light: "Light (white plate)", minimal: "Minimal (no box)" };
  var ACCENTS = ["#d4a63a", "#2bb3a3", "#3b82f6", "#c0392b", "#8e5bd8", "#e67e22"];
  var DEFAULTS = { section: "Sabbath School", role: "Opening Prayer", name: "Jane Mensah", theme: "royal", accent: "#d4a63a", logoW: 92, logoH: 92, logoKeep: true, logoBg: "circle", logoKnockout: false, logoWhite: false, logoX: null, logoY: null, logoPlace: "box", boxW: 0, boxH: 0 };
  var SAMPLE_PROGRAM = [
    "Sabbath School | Superintendent | Name Here",
    "Sabbath School | Facilitator | Name Here",
    "Sabbath School | Opening Prayer | Name Here",
    "Sabbath School | Closing Prayer | Name Here",
    "Divine Service | Scripture Reading | Name Here",
    "Divine Service | Special Song | Name Here",
    "Divine Service | Sermon | Name Here"
  ].join("\n");

  // ---------- Shared: build and fill one overlay ----------
  function makeStage() {
    return document.getElementById("stageTpl").content.firstElementChild.cloneNode(true);
  }

  function fillStage(stage, o) {
    stage.className = "stage t-" + (THEMES[o.theme] ? o.theme : "royal");
    stage.style.setProperty("--accent", o.accent || DEFAULTS.accent);
    // Tag text: dark on light accents, white on dark ones.
    var am = /^#?([0-9a-f]{6})$/i.exec(o.accent || DEFAULTS.accent), lum = 1;
    if (am) { var an = parseInt(am[1], 16); lum = (0.299 * (an >> 16) + 0.587 * ((an >> 8) & 255) + 0.114 * (an & 255)) / 255; }
    stage.style.setProperty("--pill-ink", lum < 0.55 ? "#ffffff" : "#111827");
    stage.querySelector(".pill").textContent = o.section || "";
    stage.querySelector(".name").textContent = o.name || "";
    stage.querySelector(".role").textContent = o.role || "";
    var hexA = function (hex, a) {
      var m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "";
      var n = parseInt(m[1], 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
    };
    stage.querySelector(".plate").style.background = (o.plateColor && o.theme !== "minimal") ? hexA(o.plateColor, o.theme === "light" ? 0.96 : 0.93) : "";
    stage.querySelector(".name").style.color = o.nameColor || "";
    stage.querySelector(".role").style.color = o.roleColor || "";
    var logo = stage.querySelector(".logo");
    logo.classList.toggle("on", !!o.logoSrc);
    logo.classList.toggle("bare", o.logoBg === "none");
    logo.classList.toggle("white", !!o.logoWhite);
    var lw = +o.logoW || +o.logoSize || 92, lh = +o.logoH || +o.logoSize || 92;
    logo.style.setProperty("--logo-w", lw + "px");
    logo.style.setProperty("--logo-h", lh + "px");
    logo.classList.toggle("stretch", !!o.logoStretch);
    logo.querySelector(".logo-img").style.backgroundImage = o.logoSrc ? 'url("' + o.logoSrc + '")' : "";
    // Logo sits in the name box unless it has been dragged to its own spot on the frame.
    // In the name box, the logo overlays the box (so it never makes the box taller);
    // the text moves right to make room, so the box gets wider instead.
    var plate = stage.querySelector(".plate"), row = stage.querySelector(".row"), pill = stage.querySelector(".pill");
    var size = lw, minimal = stage.classList.contains("t-minimal");
    var barW = minimal ? 6 : 12, padL = minimal ? 26 : 30;
    plate.style.paddingLeft = ""; plate.style.paddingRight = ""; pill.style.marginLeft = ""; logo.style.right = "";
    plate.style.minWidth = +o.boxW > 0 ? o.boxW + "px" : "";
    plate.style.minHeight = +o.boxH > 0 ? o.boxH + "px" : "";
    if (typeof o.logoX === "number" && typeof o.logoY === "number") {
      if (logo.parentNode !== stage) stage.appendChild(logo);
      logo.classList.add("free");
      logo.style.left = o.logoX + "px"; logo.style.top = o.logoY + "px";
    } else {
      if (logo.parentNode !== row) row.appendChild(logo);
      logo.classList.remove("free");
      logo.style.top = "";
      if (o.logoSide === "right") {
        // Logo on the right of the box; the name stays on the left.
        var padR = minimal ? 10 : 30;
        logo.style.left = ""; logo.style.right = padR + "px";
        if (o.logoSrc) plate.style.paddingRight = (padR + size + 26) + "px";
      } else {
        logo.style.left = (barW + padL) + "px";
        if (o.logoSrc) {
          plate.style.paddingLeft = (padL + size + 26) + "px";
          pill.style.marginLeft = (barW + padL + size + 26) + "px";
        }
      }
    }
    fitText(stage);
  }

  // Shrink long names so the plate never runs off screen.
  function fitText(stage) {
    var name = stage.querySelector(".name"), role = stage.querySelector(".role");
    var max = 1380;
    [[name, 62, 38], [role, 27, 18]].forEach(function (t) {
      var el = t[0], size = t[1];
      el.style.fontSize = size + "px"; el.style.whiteSpace = ""; el.style.maxWidth = "";
      while (el.scrollWidth > max && size > t[2]) { size -= 2; el.style.fontSize = size + "px"; }
      if (el.scrollWidth > max) { el.style.whiteSpace = "normal"; el.style.maxWidth = max + "px"; }
    });
  }

  function scaleTo(stage, box) {
    var s = Math.min(box.clientWidth / 1920, box.clientHeight / 1080);
    stage.style.transform = "scale(" + s + ")";
  }

  function replay(stage) {
    stage.classList.remove("animate");
    void stage.offsetWidth;
    stage.classList.add("animate");
  }

  function waitForFonts() {
    return (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  }

  var params = new URLSearchParams(location.search);

  // ---------- Overlay mode: Wirecast Web Page shot ----------
  if (params.has("name") || params.has("role")) {
    document.body.classList.add("overlay-mode");
    var vp = document.createElement("div");
    vp.className = "viewport";
    var stage = makeStage();
    vp.appendChild(stage);
    document.getElementById("app").appendChild(vp);
    var logoParam = params.get("logo");
    fillStage(stage, {
      section: params.get("section") || "",
      role: params.get("role") || "",
      name: params.get("name") || "",
      theme: params.get("theme") || "royal",
      accent: params.get("accent") ? "#" + params.get("accent").replace(/^#/, "") : DEFAULTS.accent,
      plateColor: params.get("platecolor") ? "#" + params.get("platecolor") : "",
      nameColor: params.get("namecolor") ? "#" + params.get("namecolor") : "",
      roleColor: params.get("rolecolor") ? "#" + params.get("rolecolor") : "",
      logoSrc: logoParam ? (logoParam === "1" ? "logo.png" : logoParam) : "",
      logoW: +(params.get("logow") || params.get("logosize") || 92),
      logoH: +(params.get("logoh") || params.get("logosize") || 92),
      logoStretch: params.get("logostretch") === "1",
      logoSide: params.get("logoside") === "right" ? "right" : "left",
      boxW: +(params.get("boxw") || 0),
      boxH: +(params.get("boxh") || 0),
      logoBg: params.get("logobg") || "circle",
      logoWhite: params.get("logocolor") === "white",
      logoX: params.has("logox") ? +params.get("logox") : null,
      logoY: params.has("logoy") ? +params.get("logoy") : null
    });
    var fit = function () { scaleTo(stage, vp); };
    fit();
    window.addEventListener("resize", fit);
    waitForFonts().then(function () {
      fitText(stage);
      if (params.get("anim") !== "0") replay(stage);
    });
    return;
  }

  // ---------- Maker mode ----------
  var state = load();

  function knockOutWhite(src) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth || 512, h = img.naturalHeight || 512, k = Math.min(1, 1024 / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);

          resolve(c.toDataURL("image/png"));

      img.onerror = function () { resolve(src); };
      img.src = src;
    });

    var tag = clean("a-tag"), main = clean("a-main"), sub = clean("a-sub");
    if (!main) { toast("Type the main text first."); $("a-main").focus(); return; }
    var text = $("f-program").value.replace(/\s+$/, "");
    $("f-program").value = (text ? text + "\n" : "") + tag + " | " + sub + " | " + main;
    ["a-tag", "a-main", "a-sub"].forEach(function (id) { $(id).value = ""; });
    update(false);
    toast("Added: " + main);
    var rows = $("list").children; if (rows.length) rows[rows.length - 1].scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  $("b-zip").onclick = function () {
    var items = programItems();
    if (!items.length) { toast("Add at least one line first."); return; }
    var zip = new JSZip(), used = {};
    toast("Making " + items.length + " PNGs…");
    items.reduce(function (p, it) {
      return p.then(function () {
        return renderPng(it).then(function (blob) {
          var n = fileName(it), k = 2;
          while (used[n]) n = fileName(it).replace(/\.png$/, " (" + (k++) + ").png");
          used[n] = 1; zip.file(n, blob);
        });
      });
    }, Promise.resolve())
      .then(function () { return zip.generateAsync({ type: "blob" }); })
      .then(function (blob) { download(blob, "lower-thirds.zip"); toast("Saved lower-thirds.zip"); })
      .catch(function () { toast("Couldn't make the ZIP here. Open this file on the Mac in Chrome or Safari."); });
  };

  // ---------- Helpers ----------
  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem("lt-maker") || "null");
      if (s) {
        if (s.logoSize && !s.logoW) { s.logoW = s.logoH = s.logoSize; }  // older versions had one size
        return Object.assign({}, DEFAULTS, s);
      }
    } catch (e) {}
    return Object.assign({}, DEFAULTS);
  }
  function save(s) { try { localStorage.setItem("lt-maker", JSON.stringify(s)); } catch (e) {} }

  if (logoOriginal) measureLogo(logoOriginal, function () {});
  refreshLogo(false);
  waitForFonts().then(function () { update(true); });
})();
</script>
</body>
</html>
